# All services share one image (built once) — ROS 2 Lyrical
x-rov: &rov
  image: rov-topside:lyrical
  build: .
  network_mode: host
  restart: unless-stopped

services:
  joy_publisher:
    <<: *rov
    privileged: true  # for /dev/input access
    volumes:
      - /dev/input:/dev/input:ro
    command: ros2 run rov_joystick joy_publisher

  web_dashboard:
    <<: *rov
    command: ros2 run rov_dashboard server
    # Dashboard served on http://localhost:8080, WebSocket on ws://localhost:9090

  photogrammetry_saver:
    <<: *rov
    volumes:
      - ./captures:/rov_captures
    command: ros2 run rov_photogrammetry saver --ros-args -p save_dir:=/rov_captures
