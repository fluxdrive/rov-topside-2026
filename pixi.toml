# Topside environment: ROS 2 Lyrical from RoboStack, managed by pixi.
# Works on any x86_64 Linux (AlmaLinux 10, Debian, Fedora, ...) without system ROS.
#
#   pixi install          # create the environment (first time, ~few GB)
#   pixi run build        # colcon build
#   pixi run start        # = ./start.sh   (start.sh also re-runs itself under pixi automatically)
#   pixi shell            # interactive shell with ROS sourced (ros2 topic list, etc.)
#
# Commit pixi.lock after the first successful `pixi install` so every machine gets identical versions.

[workspace]
name = "rov-topside"
version = "0.1.0"
description = "ROV topside pilot station (ROS 2 Lyrical via RoboStack)"
channels = ["https://prefix.dev/robostack-lyrical", "https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[dependencies]
# ROS 2 Lyrical + what the nodes import
ros-lyrical-ros-base = "*"            # rclpy, ros2 CLI, std/sensor msgs, rosbag2 for recording dives
ros-lyrical-rmw-cyclonedds-cpp = "*"  # we use Cyclone DDS with unicast peers (Fast DDS is the default)
ros-lyrical-mavros-msgs = "*"         # dashboard subscribes to /mavros/* message types
ros-lyrical-std-srvs = "*"
websockets = "*"                      # dashboard WebSocket server
# Build tools (ament_python packages only, no compilers needed)
colcon-common-extensions = "*"
# setuptools >=80 changed `setup.py develop`, which colcon --symlink-install relies on;
# very old pins like <=58.2 break on Python 3.12+. This range works for both.
setuptools = ">=68,<80"

[pypi-dependencies]
# python-evdev isn't on conda-forge; evdev-binary is the same library as prebuilt x86_64 wheels (no compiler)
evdev-binary = "*"

[activation]
# Sets RMW/Cyclone config and sources install/setup.sh (if built) on `pixi run` / `pixi shell`
scripts = ["scripts/pixi-activate.sh"]

[tasks]
build = "colcon build --symlink-install"
clean = "rm -rf build install log"
start = "./start.sh"
start-bg = "./start.sh -d"
stop = "./stop.sh"
check = "python -c \"import rclpy, mavros_msgs.msg, sensor_msgs.msg, std_srvs.srv, evdev, websockets, sys; print('imports OK, Python', sys.version.split()[0])\""
